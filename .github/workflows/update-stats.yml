name: Обновление статистики и новостей

on:
  schedule:
    # Пт–пн каждые 4 часа по UTC и каждый день в 04:00 UTC (09:00 Екатеринбург).
    - cron: "0 */4 * * 5,6,0,1"
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Обновить data.json и news.json
        run: python3 scripts/update_stats.py

      - name: Закоммитить, если цифры или новости изменились
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json news.json
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "Обновить статистику и новости."
            git push origin HEAD:main
          fi
