name: Обновление статистики и новостей

on:
  schedule:
    # Суббота и воскресенье — каждый час, в остальные дни — каждые 3 часа. Дни и часы по UTC.
    - cron: "0 * * * 0,6"
    - cron: "0 */3 * * 1-5"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Отправить тестовое уведомление всем подписчикам"
        type: boolean
        default: false
      regen_ai:
        description: "Заново сделать ИИ-разбор последней игры с протоколом"
        type: boolean
        default: false
      height_cm:
        description: "Ручной рост, см (120–220). Пусто — не менять."
        type: string
        default: ""
      weight_kg:
        description: "Ручной вес, кг (25–120). Пусто — не менять."
        type: string
        default: ""
      clear_manual_body:
        description: "Сбросить ручные рост и вес и снова брать их из протокола"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      PUSH_TEST: ${{ github.event.inputs.test_push == 'true' && '1' || '0' }}
      AI_REGEN: ${{ github.event.inputs.regen_ai == 'true' && '1' || '0' }}
      HEIGHT_CM: ${{ github.event.inputs.height_cm }}
      WEIGHT_KG: ${{ github.event.inputs.weight_kg }}
      CLEAR_MANUAL_BODY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.clear_manual_body == 'true' && '1' || '0' }}
    steps:
      - name: Забрать main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Обновить data.json и news.json
        run: python3 scripts/update_stats.py

      - name: Закоммитить, если цифры или новости изменились
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json news.json
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "Обновить статистику и новости."
            git push origin HEAD:main
          fi
